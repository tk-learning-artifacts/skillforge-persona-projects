# Ping Mount V3: Marcus's Cura settings for PLA on a 0.4 mm nozzle.
# These are Cura's own setting names and values, laid out like a Cura
# profile file. It has not been tested as an import. Cura exports profiles
# as a zipped .curaprofile, so the safe way is to type these into Custom mode.
# Load ping-mount-v3.stl as it is. It is already lying on its side.

[general]
version = 4
name = Ping Mount PLA 0.28 fast
definition = fdmprinter

[metadata]
type = quality_changes
quality_type = draft

[values]
layer_height = 0.28
wall_line_count = 4
top_layers = 4
bottom_layers = 4
infill_sparse_density = 15
infill_pattern = grid
support_enable = False
adhesion_type = brim
brim_width = 5
material_print_temperature = 210
material_bed_temperature = 60
