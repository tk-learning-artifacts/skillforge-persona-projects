# The Volume Box: Aisha's Cura settings for PLA on a 0.4 mm nozzle.
# These are Cura's own setting names and values, laid out like a Cura
# profile file. It has not been tested as an import. Cura exports profiles
# as a zipped .curaprofile, so the safe way is to type these into Custom mode.

[general]
version = 4
name = Volume Box PLA 0.2
definition = fdmprinter

[metadata]
type = quality_changes
quality_type = normal

[values]
layer_height = 0.2
layer_height_0 = 0.2
wall_line_count = 3
top_layers = 5
bottom_layers = 5
infill_sparse_density = 15
infill_pattern = gyroid
support_enable = False
adhesion_type = skirt
material_print_temperature = 205
material_bed_temperature = 60
